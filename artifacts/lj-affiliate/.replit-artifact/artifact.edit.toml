kind = "web"
previewPath = "/"
title = "LJ Affiliate"
version = "1.0.0"
id = "lj-affiliate-app"

[[services]]
localPort = 3000
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/lj-affiliate run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/lj-affiliate", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "artifacts/lj-affiliate/.next/standalone/server.js"]

[services.production.run.env]
PORT = "3000"
HOSTNAME = "0.0.0.0"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/health"
